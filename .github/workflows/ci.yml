name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check nix flake
        run: nix flake check
      - name: Build nix package
        run: nix build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, nix-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish NuGet
        run: |
          dotnet pack src/SarifRatchet/SarifRatchet.csproj -c Release -o out
          dotnet nuget push out/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Build Self-Contained Binaries
        run: |
          dotnet publish src/SarifRatchet/SarifRatchet.csproj -c Release -r win-x64 --self-contained true -o bin/win-x64
          dotnet publish src/SarifRatchet/SarifRatchet.csproj -c Release -r linux-x64 --self-contained true -o bin/linux-x64
          dotnet publish src/SarifRatchet/SarifRatchet.csproj -c Release -r osx-arm64 --self-contained true -o bin/osx-arm64
      - name: Publish npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
