name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deep clone so nbgv can compute version height
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check nix flake
        run: nix flake check
      - name: Build nix package
        run: nix build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, nix-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # deep clone so nbgv can compute version height
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Verify version matches tag
        run: |
          dotnet tool install -g nbgv
          NBGV_VERSION="v$(nbgv get-version --variable NuGetPackageVersion)"
          if [ "$NBGV_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match NBGV version $NBGV_VERSION"
            exit 1
          fi
      - name: Pack NuGet
        run: dotnet pack src/SarifRatchet/SarifRatchet.csproj -c Release /p:PublicRelease=true -o out
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet
        run: dotnet nuget push out/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Build Self-Contained Binaries
        run: |
          dotnet publish src/SarifRatchet/SarifRatchet.csproj -c Release -r win-x64 --self-contained true -o bin/win-x64
          dotnet publish src/SarifRatchet/SarifRatchet.csproj -c Release -r linux-x64 --self-contained true -o bin/linux-x64
          dotnet publish src/SarifRatchet/SarifRatchet.csproj -c Release -r osx-arm64 --self-contained true -o bin/osx-arm64
      - name: Publish npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
